name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 1) 검사 — 린트 → 타입 체크 → 테스트 → 빌드
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: next-build
          path: |
            .next
            public
          retention-days: 1

  # 2) 배포 — verify 통과 + main push일 때만
  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: next-build
          path: .

      - name: Assemble standalone bundle
        run: |
          mkdir -p deploy
          cp -r .next/standalone/. deploy/
          mkdir -p deploy/.next
          cp -r .next/static deploy/.next/static
          cp -r public deploy/public

      - name: Deploy to server via rsync
        uses: burnett01/rsync-deployments@v9
        with:
          switches: -avzr --delete
          path: deploy/
          remote_path: ~/htdocs/mechurial/
          remote_host: ${{ secrets.HOST }}
          remote_user: ${{ secrets.USERNAME }}
          remote_port: ${{ secrets.PORT }}
          remote_key: ${{ secrets.KEY }}

      - name: Restart and health check
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets. PORT }}
          command_timeout: 5m
          script: |
            export PATH=$HOME/.nvm/versions/node/v22.22.0/bin:$PATH
            cd ~/htdocs/mechurial

            if pm2 describe mechurial > /dev/null 2>&1; then
              echo "> Reloading server..."
              pm2 reload mechurial --update-env
            else
              echo "> Starting server fresh..."
              PORT=3003 pm2 start server.js --name "mechurial"
            fi

            echo "> Waiting for server to come up..."
            sleep 3

            echo "> Health check on localhost:3003..."
            for i in 1 2 3 4 5; do
              if curl -fsS http://localhost:3003/mechu > /dev/null; then
                echo "> Health check passed."
                exit 0
              fi
              echo "  attempt $i failed, retrying in 3s..."
              sleep 3
            done

            echo "> Health check FAILED after retries."
            exit 1
